            html, body {
                height: 100%;
                margin: 0;
            }

                display: flex;
                flex-direction: column;
                min-height: 100vh;
            }

            main {
                flex: 1 0 auto;
                display: flex;
                flex-direction: column;
            }

            form {
                flex: 1;
            }

            .coluna-esquerda {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }

        </style>

            <nav class="navbar navbar-expand-lg site-navbar">

                    <a class="navbar-brand site-navbar-brand" href="PaginaIncial.html#home" aria-label="3DConecta - Home">

                            <img src="../Imagem/logo.png" alt="3DConecta" class="site-logo">
                        </span>
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNavbar" aria-controls="siteNavbar" aria-expanded="false" aria-label="Abrir menu de navegação">

                    </button>
                    <div class="collapse navbar-collapse" id="siteNavbar">

                        </ul>
                        <a class="btn btn-light site-login-button" href="Entrar.html">Logar</a>
                    </div>
                </div>
            </nav>
        </header>

        <main class="container py-3">
            <form class="row g-3">
                <div class="col-sm-12 col-md-8 coluna-esquerda">
                    <div class="formatacaoCaixaArredondada p-3 mb-3 border">
                        <div class="mb-3">
                            <label for="nome_impressora" class="form-label">Nome da Impressora: *</label>
                            <input type="text" id="nome_impressora" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label for="marca" class="form-label">Marca: *</label>
                            <input type="text" id="marca" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label for="volume_util" class="form-label">Volume Útil de Impressão (X, Y, Z em mm): *</label>
                            <input type="text" id="volume_util" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Filamento: *</label> 
                            
                            <div class="formatacaoCaixaArredondada border d-flex flex-column p-3 gap-2">
                                
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="pla" name="filamento" value="PLA">
                                    <label class="form-check-label" for="pla">PLA</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="abs" name="filamento" value="ABS">
                                    <label class="form-check-label" for="abs">ABS</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="petg" name="filamento" value="PETG">
                                    <label class="form-check-label" for="petg">PETG</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="tpu" name="filamento" value="TPU">
                                    <label class="form-check-label" for="tpu">TPU</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="nylon" name="filamento" value="Nylon">
                                    <label class="form-check-label" for="nylon">Nylon</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="asa" name="filamento" value="ASA">
                                    <label class="form-check-label" for="asa">ASA</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="outro" name="filamento" value="Outro">
                                    <label class="form-check-label" for="outro">Outro</label>
                                </div>

                            </div>
                        </div>
                    </div>


                <div class="col-sm-12 col-md-4">
                    <aside class="formatacaoCaixaArredondada p-3 border h-100 d-flex align-items-center justify-content-center">
                        <div class="d-flex flex-column gap-3">
                            <button type="button" onclick="window.location.href='PaginaIncial.html'" class="btn" style="background-color: #A70404; color:#fff; height: 50px; width: 150px;">Voltar</button>
                            <button class="btn" style="background-color: #008F11; color:#fff; height: 50px; width: 150px;" type="submit">Criar Impressora</button>
                        </div>
                    </aside>
                </div>
                
            </form>
        </main>

                        </div>
                    </nav>

                        <p class="site-footer-copyright text-center mb-0">© 2026 3DConecta. Todos os direitos reservados.</p>
                    </div>
                </div>
            </div>
        </footer>
