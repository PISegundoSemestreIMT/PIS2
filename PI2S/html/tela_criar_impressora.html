        <link rel="stylesheet" href="../css/header.css">
        <link rel="stylesheet" href="../css/footer.css">

            html, body {
                height: 100%;
                margin: 0;
            }

            body {
                display: flex;
                flex-direction: column;
                min-height: 100vh;
            }

            main {
                flex: 1 0 auto;
                display: flex;
                flex-direction: column;
            }

            form {
                flex: 1;
            }

            .coluna-esquerda {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }
        </style>

    <body>
        <header class="site-header">
            <nav class="navbar navbar-expand-lg site-navbar">
                <div class="container-fluid">
                    <a class="navbar-brand site-navbar-brand" href="PaginaIncial.html#home" aria-label="3DConecta - Home">
                        <span class="site-logo-wrapper">
                            <img src="../Imagem/logo.png" alt="3DConecta" class="site-logo">
                        </span>
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNavbar" aria-controls="siteNavbar" aria-expanded="false" aria-label="Abrir menu de navegação">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="siteNavbar">
                        <ul class="navbar-nav mx-auto mb-3 mb-lg-0 site-nav-list">
                            <li class="nav-item"><a class="nav-link site-nav-link" href="PaginaIncial.html#home">Home</a></li>
                            <li class="nav-item"><a class="nav-link site-nav-link" href="PaginaIncial.html#sobre-nos">Sobre nós</a></li>
                            <li class="nav-item"><a class="nav-link site-nav-link" href="como_comecar.html">Como começar</a></li>
                        </ul>
                        <a class="btn btn-light site-login-button" onclick="fazerLogout()" href="PaginaIncial.html">Sair da Conta</a>
                    </div>
                </div>
            </nav>
        </header>

        <main class="container py-3">
            <form id="formImpressora" class="row g-3">
                <div class="col-sm-12 col-md-8 coluna-esquerda">
                    <div class="formatacaoCaixaArredondada p-3 mb-3 border">
                        <div class="mb-3">
                            <label for="nome_impressora" class="form-label">Nome da Impressora: *</label>
                            <input type="text" id="nome_impressora" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="marca" class="form-label">Marca: *</label>
                            <input type="text" id="marca" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="volume_util" class="form-label">Volume Útil de Impressão (Ex: 220, 220, 250 em mm): *</label>
                            <input type="text" id="volume_util" class="form-control" placeholder="X, Y, Z separados por vírgula" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Filamento: *</label> 
                            
                            <div class="formatacaoCaixaArredondada border d-flex flex-column p-3 gap-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="pla" name="filamento" value="PLA">
                                    <label class="form-check-label" for="pla">PLA</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="abs" name="filamento" value="ABS">
                                    <label class="form-check-label" for="abs">ABS</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="petg" name="filamento" value="PETG">
                                    <label class="form-check-label" for="petg">PETG</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="tpu" name="filamento" value="TPU">
                                    <label class="form-check-label" for="tpu">TPU</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="nylon" name="filamento" value="Nylon">
                                    <label class="form-check-label" for="nylon">Nylon</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="asa" name="filamento" value="ASA">
                                    <label class="form-check-label" for="asa">ASA</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="outro" name="filamento" value="Outro">
                                    <label class="form-check-label" for="outro">Outro</label>
                                </div>
                            </div>
                        </div>
                    </div>
                 </div>

                <div class="col-sm-12 col-md-4">
                    <aside class="formatacaoCaixaArredondada p-3 border h-100 d-flex align-items-center justify-content-center">
                        <div class="d-flex flex-column gap-3">
                            <button type="button" onclick="window.location.href='PaginaIncial.html'" class="btn" style="background-color: #A70404; color:#fff; height: 50px; width: 150px;">Voltar</button>
                            <button class="btn" style="background-color: #008F11; color:#fff; height: 50px; width: 150px;" type="submit">Criar Impressora</button>
                        </div>
                    </aside>
                </div>
            </form>
        </main>

        <footer class="site-footer mt-auto">
            <div class="container py-4">
                <div class="row g-4">
                    <section class="col-12 col-md-6 text-center text-md-start">

                    </section>

                        <h2 class="site-footer-heading">Navegação</h2>
                        <div class="site-footer-nav d-flex flex-column gap-2">
                            <a href="PaginaIncial.html#home">Início</a>

                            <a href="como_comecar.html">Como começar</a>
                            <a href="https://maua.br/">Instituto Mauá</a>

                        </div>
                    </nav>
                    <div class="col-12">
                        <p class="site-footer-copyright text-center mb-0">© 2026 3DConecta. Todos os direitos reservados.</p>
                    </div>
                </div>
            </div>
        </footer>

        <!-- Importação do Bootstrap e Axios -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <script>
            const protocolo = 'http://';
            const baseURL = 'localhost:3000';

            // Verifica o login assim que a página carrega
            const dadosSalvos = sessionStorage.getItem("usuarioLogado");

            if (!dadosSalvos) {
                alert("Acesso negado! Por favor, faça login.");
                window.location.href = "Entrar.html";
            }

            const usuario = dadosSalvos ? JSON.parse(dadosSalvos) : null;

            document.getElementById('formImpressora').addEventListener('submit', async function(e) {
                e.preventDefault();

                if (!usuario || !usuario._id) {
                    alert("Sessão inválida. Faça login novamente.");
                    window.location.href = "Entrar.html";
                    return;
                }

                const empresaId = usuario._id;

                const nome_impressora = document.getElementById('nome_impressora').value;
                const marca = document.getElementById('marca').value;
                const volumeTexto = document.getElementById('volume_util').value;

                const partesVolume = volumeTexto.split(',').map(num => parseFloat(num.trim()));
                const volume_util = {
                    x: partesVolume[0] || 0,
                    y: partesVolume[1] || 0,
                    z: partesVolume[2] || 0
                };

                const filamentosSelecionados = [];
                document.querySelectorAll('input[name="filamento"]:checked').forEach(checkbox => {
                    filamentosSelecionados.push(checkbox.value);
                });

                const dadosImpressora = {
                    nome_impressora,
                    marca,
                    volume_util,
                    filamentos: filamentosSelecionados
                };

                try {
                    await axios.post(`${protocolo}${baseURL}/empresas/${empresaId}/impressoras`, dadosImpressora);

                    alert("Impressora cadastrada com sucesso!");
                    window.location.href = 'tela_visualizar_empresa.html';
                } catch (error) {
                    console.error("Erro ao cadastrar impressora:", error);
                    alert("Erro ao cadastrar a impressora. Verifique os dados.");
                }
            });
            function fazerLogout() {
                sessionStorage.removeItem("usuarioLogado"); // Remove os dados
                window.location.href = "Entrar.html"; // Volta para o login
            }
        </script>
    </body>
</html>
