        <main class="container my-4">
            <div class="container-abas col-12 mb-3">

                <div class="aba" onclick="mudarAba(event, 'funcionarios')">Funcionários</div>

            <div class="container-conteudo col-12">    
                <div id="pedidos" class="conteudo-aba ativo formatacaoCaixaArredondada p-3" style="max-height: 610px; overflow-y: auto;">
                </div>

                <div id="funcionarios" class="conteudo-aba formatacaoCaixaArredondada p-3" style="max-height: 610px; overflow-y: auto;">
                </div>

                <div class="col-12">
                    <button class="btn btn-primary mt-3" type="button" onclick="criarFuncionario(event)" style="background-color: #006ad4; border-color: #006ad4; height: 50px; width: 150px;">Criar Funcionário</button>
                </div>
            </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script>
            function mudarAba(evento, idAba) {
                const abas = document.querySelectorAll('.aba');
                abas.forEach(aba => aba.classList.remove('ativa'));
                const conteudos = document.querySelectorAll('.conteudo-aba');
                conteudos.forEach(conteudo => conteudo.classList.remove('ativo'));
                evento.currentTarget.classList.add('ativa');
                document.getElementById(idAba).classList.add('ativo');
            }

            const protocolo = 'http://';
            const baseURL = 'localhost:3000';
            let usuario = null
            document.addEventListener("DOMContentLoaded", () => {
                const dadosSalvos = sessionStorage.getItem("usuarioLogado");

                if (!dadosSalvos) {
                    alert("Acesso negado! Por favor, faça login.");
                    window.location.href = "Entrar.html";
                    return;
                }

                usuario = JSON.parse(dadosSalvos);
                carregarPedidos();
                carregarFuncionarios();
            });

            function esc(t) {
                return String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            }

            async function carregarFuncionarios() {
                const div = document.getElementById('funcionarios');
                try {
                    const resposta = await axios.get(`${protocolo}${baseURL}/funcionarios`);
                    const lista = resposta.data.filter(f => f.empresa === usuario._id);

                    if (lista.length === 0) {
                        div.innerHTML = '<p class="text-center text-muted">Nenhum funcionário cadastrado.</p>';
                        return;
                    }

                    div.innerHTML = lista.map(f => `
                        <div class="formatacaoCaixaArredondada p-3 mb-3 border bg-white">
                            <p class="mb-1"><strong>Nome:</strong> ${esc(f.nome)}</p>
                            <p class="mb-1"><strong>Email:</strong> ${esc(f.email)}</p>
                            <p class="mb-0"><button class="btn btn-primary" type="button" onclick="deletarFunc('${f._id}')" style="background-color: #A70404; border-color: #A70404; color:#fff; height: 40px; width: 200px;">Deletar Funcionário</button>

                        </div>
                    `).join('');
                } catch (erro) {
                    console.error("Erro ao carregar funcionários:", erro);
                    div.innerHTML = '<p class="text-center text-danger">Erro ao carregar os funcionários.</p>';
                }
            }

            async function carregarPedidos() {
                const div = document.getElementById('pedidos');
                try {
                    const resposta = await axios.get(`${protocolo}${baseURL}/pedidos`);
                    const lista = resposta.data.filter(p => p.empresa_receptora === usuario._id);;

                    if (lista.length === 0) {
                        div.innerHTML = '<p class="text-center text-muted">Nenhum pedido cadastrada.</p>';
                        return;
                    }
                    const pedidosComDados = await Promise.all(lista.map(async p => {
                        const [empFab, agFab, agRec] = await Promise.all([
                            buscarDados('empresas', p.empresa_fabricante),
                            buscarDados('funcionarios', p.agente_fabricante),
                            buscarDados('funcionarios', p.agente_receptor)
                        ]);
                        return { p, empFab, agFab, agRec };
                    }));
                    div.innerHTML = pedidosComDados.map(({ p, empFab, agFab, agRec }) =>`
                    <div class="formatacaoCaixaArredondada p-3 mb-3 border bg-white">
                                        <div class="row align-items-center g-3">
                                            <div class="col-md-3 text-center">
                                                ${p.modeloPath ? `
                                                    <model-viewer src="${protocolo}${baseURL}/pedidos/modelo/${p._id}"
                                                        alt="Modelo 3D do pedido"
                                                        auto-rotate
                                                        shadow-intensity="1" loading="lazy"
                                                        style="width:100%; height:180px; background:#f1f1f1; border-radius:24px;">
                                                    </model-viewer>
                                                ` : `
                                                    <img src="../Imagem/pedidosPendentes.png" alt="foto pedido" class="img-fluid rounded-4" style="max-height: 150px; object-fit: cover;">
                                                `}
                                            </div>
                                            <div class="col-md-9">
                                                <div class="row g-2 mb-2">
                                                    <div class="col-sm-6">
                                                        <p class="mb-1"><strong>Nome:</strong> ${p.nome || 'Não informado'}</p>
                                                    </div>
                                                    <div class="col-sm-6">
                                                        <p class="mb-1"><strong>Tipo de Filamento:</strong> ${p.tipo_filamento || 'Não informado'}</p>
                                                    </div>
                                                </div>
                                                <div class="row g-2 mb-2">
                                                    <div class="col-sm-6">
                                                        <p class="mb-1"><strong>Tempo Estimado:</strong> ${p.tempo_estimado || 'Não informado'}</p>
                                                    </div>
                                                    <div class="col-sm-6">
                                                        <p class="mb-1"><strong>Empresa Produtora:</strong> ${textoPessoa(empFab, 'nome_empresa')}</p>
                                                    </div>
                                                </div>
                                                <div class="row g-2 mb-2">
                                                    <div class="col-sm-6">
                                                        <p class="mb-1"><strong>Agente Receptor:</strong> ${textoPessoa(agRec, 'nome')}</p>
                                                    </div>
                                                    <div class="col-sm-6">
                                                        <p class="mb-1"><strong>Agente Produtor:</strong> ${textoPessoa(agFab, 'nome')}</p>
                                                    </div>
                                                </div>
                                                <div class="row g-2 mb-2">
                                                    <div class="col-sm-6">
                                                        <p class="mb-1"><strong>Status:</strong> ${p.status || 'Não informado'}</p>
                                                    </div>
                                                    <div class="col-sm-6">
                                                        <p class="mb-1"><strong>Data do Status:</strong> ${dataDoStatus(p)}</p>
                                                    </div>  
                                                </div>
                                                <div class="mb-1">
                                                    <p class="mb-1"><strong>Descrição:</strong></p>
                                                    <textarea class="form-control" style="height: 80px; resize: none; border-radius: 15px;" readonly>${p.descricao || ''}</textarea>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                `).join('');
                } catch (erro) {
                    console.error("Erro ao carregar pedidos:", erro);
                    div.innerHTML = '<p class="text-center text-danger">Erro ao carregar as pedidos.</p>';
                }
            }

            function criarFuncionario(event) {
                event.preventDefault();
                const dadosSessao = sessionStorage.getItem("usuarioLogado");

                if (!dadosSessao) {
                    alert("Erro: Você precisa estar logado para criar um funcionário.");
                    window.location.href = "Entrar.html";
                    return;
                }
                window.location.href = "tela_criar_func.html";
            }

            async function deletarFunc(id) {
                if (!confirm("Tem certeza que deseja deletar este funcionario?")) return;
                try {
                    const resposta = await axios.delete(`${protocolo}${baseURL}/funcionarios/delete/${id}`);
                    alert(resposta.data.mensagem);
                    carregarFuncionarios();
                } catch (erro) {
                    console.error(erro);
                    alert(erro.response?.data?.erro || "Erro ao deletar o funcionario.");
                }
            }
            
            async function buscarDados(tipo, id) {
                if (!id) return null;
                try {
                    const r = await fetch(`${protocolo}${baseURL}/${tipo}/${encodeURIComponent(id)}`);
                    if (!r.ok) return null;
                    return await r.json();
                } catch {
                    return null;
                }
            }

            function dataDoStatus(p) {
                const data = p.data_conclusao || p.data_andamento || p.data_criacao;
                if (!data) return 'Não informado';

                return new Date(data).toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'});
            }

            function textoPessoa(dados, campoNome) {
                if (!dados) return 'Não informado';
                return `${esc(dados[campoNome] || 'Não informado')} | ${esc(dados.email || 'Não informado')}`;
            }

            function fazerLogout() {
                sessionStorage.removeItem("usuarioLogado");
                window.location.href = "Entrar.html";
            }
        </script>
    
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
