        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Cadastrar Empresa</title>

        <link rel="stylesheet" href="../css/Estilo.css">
        <link rel="stylesheet" href="../css/header.css">
        <link rel="stylesheet" href="../css/footer.css">
        <style>
            html, body {
                height: 100%;
                margin: 0;
            }
 
            body {
                display: flex;
                flex-direction: column;
                min-height: 100vh;
            }
 
            main {
                flex: 1 0 auto;
                display: flex;
                flex-direction: column;
                margin-top: 80px;
                margin-bottom: 90px;
            }
 
            form {
                flex: 1;
            }
 
            .coluna-esquerda {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }
        </style>
    </head>
    <body>
        <header class="site-header">
            <nav class="navbar navbar-expand-lg site-navbar">
                <div class="container-fluid">
                    <a class="navbar-brand site-navbar-brand" href="PaginaIncial.html#home" aria-label="3DConecta - Home">
                        <span class="site-logo-wrapper">
                            <img src="../Imagem/logo.png" alt="3DConecta" class="site-logo">
                        </span>
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNavbar" aria-controls="siteNavbar" aria-expanded="false" aria-label="Abrir menu de navegação">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="siteNavbar">
                        <ul class="navbar-nav mx-auto mb-3 mb-lg-0 site-nav-list">
                            <li class="nav-item"><a class="nav-link site-nav-link" href="PaginaIncial.html#home">Home</a></li>
                            <li class="nav-item"><a class="nav-link site-nav-link" href="PaginaIncial.html#sobre-nos">Sobre nós</a></li>
                            <li class="nav-item"><a class="nav-link site-nav-link" href="como_comecar.html">Como começar</a></li>
                        </ul>
                        <a class="btn btn-light site-login-button" onclick="fazerLogout()" href="PaginaIncial.html">Sair da Conta</a>
                    </div>
                </div>
            </nav>
        </header>
 
        <main class="container-fluid py-3">
            <form id="formEmpresa" class="row h-100 g-3" novalidate>
                <div class="col-sm-12 col-md-8 coluna-esquerda">
                    <div class="formatacaoCaixaArredondada p-3 mb-3 border">
                        <div class="row">
                            <div class="col-12 col-md-6 mb-3">
                                <label for="nomeEmpresa" class="form-label">Nome da empresa: *</label>
                                <input type="text" id="nomeEmpresa" name="nome_empresa" class="form-control" required>
                            </div>
                            <div class="col-12 col-md-6 mb-3">
                                <label for="email" class="form-label">Email: *</label>
                                <input type="email" id="email" name="email" class="form-control" required>
                            </div>
                        </div>
 
                        <div class="row">
                            <div class="col-12 col-md-6 mb-3">
                                <label for="cnpj" class="form-label">CNPJ: *</label>
                                <input type="text" id="cnpj" name="cnpj" class="form-control" inputmode="numeric" maxlength="14" pattern="\d{14}" placeholder="Somente números (14 dígitos)" required>
                            </div>
                            <div class="col-12 col-md-6 mb-3">
                                <label for="senha" class="form-label">Senha: *</label>
                                <input type="password" id="senha" name="senha" class="form-control" required>
                            </div>
                        </div>
 
                        <div class="row">
                            <div class="col-12 col-md-6 mb-3">
                                <label for="tipo" class="form-label">Tipo da empresa: *</label>
                            <select id="tipo" name="tipo" class="form-select">
                                <option value="produtor">Fabricante</option>
                                <option value="receptor">Receptor</option>
                            </select>
                            </div>
                            <div class="col-12 col-md-6 mb-3">
                                <label for="repitaSenha" class="form-label">Repita Senha: *</label>
                                <input type="password" id="repitaSenha" class="form-control" required>
                                <div class="invalid-feedback">As senhas não coincidem.</div>
                            </div>
                        </div>
                    </div>
                </div>
 
                <div class="col-sm-12 col-md-4 d-flex flex-column justify-content-between">
                    <aside class="formatacaoCaixaArredondada p-3 border h-100 d-flex flex-column justify-content-between">
                        <div class="d-flex flex-column gap-3 my-auto align-items-center justify-content-center" style="margin-top: 20px;">
                            <button type="button" onclick="window.location.href='PaginaIncial.html'" class="btn" style="background-color: #A70404; color:#fff; height: 50px; width: 190px;">Voltar</button>
                            <button class="btn" style="background-color: #008F11; color:#fff; height: 50px; width: 190px;" type="submit">Cadastrar Empresa</button>
                        </div>
                    </aside>
                </div>
            </form>
        </main>
 
        <footer class="site-footer mt-auto">
            <div class="container py-4">
                <div class="row g-4">
                    <section class="col-12 col-md-6 text-center text-md-start">
                        <h2 class="site-footer-heading">Fale conosco</h2>
                        <p class="site-footer-email mb-2"><a href="mailto:3dconecta@gmail.com">3dconecta@gmail.com</a></p>

                    </section>
                    <nav class="col-12 col-md-6 site-footer-navigation text-center text-md-end" aria-label="Navegação do rodapé">
                        <h2 class="site-footer-heading">Navegação</h2>
                        <div class="site-footer-nav d-flex flex-column gap-2">
                            <a href="PaginaIncial.html#home">Início</a>
                            <a href="PaginaIncial.html#sobre-nos">Sobre nós</a>
                            <a href="como_comecar.html">Como começar</a>
                            <a href="https://maua.br/">Instituto Mauá</a>

                        </div>
                    </nav>
                    <div class="col-12">
                        <p class="site-footer-copyright text-center mb-0">© 2026 3DConecta. Todos os direitos reservados.</p>
                    </div>
                </div>
            </div>
        </footer>
 
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <script>
            const protocolo = 'http://';
            const baseURL = 'localhost:3000';

            const cnpj = document.getElementById('cnpj');
            const senha = document.getElementById('senha');
            const repitaSenha = document.getElementById('repitaSenha');
            const form = document.getElementById('formEmpresa');
 
            cnpj.addEventListener('input', function () {
                this.value = this.value.replace(/\D/g, '').slice(0, 14);
            });
 
            function validarSenhas() {
                if (repitaSenha.value && senha.value !== repitaSenha.value) {
                    repitaSenha.setCustomValidity('As senhas não coincidem.');
                    repitaSenha.classList.add('is-invalid');
                } else {
                    repitaSenha.setCustomValidity('');
                    repitaSenha.classList.remove('is-invalid');
                }
            }
            senha.addEventListener('input', validarSenhas);
            repitaSenha.addEventListener('input', validarSenhas);
 
            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                validarSenhas();
                
                if (cnpj.value.replace(/\D/g, '').length !== 14) {
                    cnpj.setCustomValidity('CNPJ deve ter 14 dígitos.');
                } else {
                    cnpj.setCustomValidity('');
                }

                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }

                const dadosEmpresa = {
                    nome_empresa: document.getElementById('nomeEmpresa').value,
                    email: document.getElementById('email').value,
                    senha: senha.value,
                    cnpj: cnpj.value,
                    tipo: document.getElementById('tipo').value
                };

                try {
                    const resposta = await axios.post(`${protocolo}${baseURL}/empresas`, dadosEmpresa);
                    alert("Empresa cadastrada com sucesso!");
                    
                    localStorage.setItem('empresaId', resposta.data._id);
                    
                } catch (error) {
                    console.error("Erro ao cadastrar empresa:", error);
                    alert("Erro ao cadastrar empresa. Verifique se o e-mail ou CNPJ já existem.");
                }
            });
            function fazerLogout() {
                sessionStorage.removeItem("usuarioLogado");
                window.location.href = "Entrar.html";
            }
        </script>
    
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

    </body>
</html>
