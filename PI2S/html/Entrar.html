        <main class="login-card container my-5 p-5 text-center">
            <h1 class="mb-4">LOGIN</h1>
            
            <div id="mensagemErro" class="mb-3"></div>

            <form class="login-form mx-auto" onsubmit="login(event)">
                <div class="login-fields">
                    <div class="row align-items-center g-2 mb-3">
                        <label for="email" class="col-3 col-md-2 col-form-label text-end">Email:</label>
                        <div class="col-9 col-md-10">

                    </div>
                    <div class="row align-items-center g-2 mb-4">
                        <label for="senha" class="col-3 col-md-2 col-form-label text-end">Senha:</label>
                        <div class="col-9 col-md-10">
                            <input type="password" id="senha" class="form-control" required>
                        </div>
                    </div>
                </div>
                <input class="btn btn-primary mt-3" type="submit" id="botaoEntrar" value="Entrar">
            </form>
            <a class="login-register-link d-block mt-4" href="como_comecar.html">Sua empresa não tem uma conta? Comece por aqui.</a>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8" crossorigin="anonymous"></script>
        <script>
            async function login(event) {
                event.preventDefault();

                const email = document.getElementById('email').value;
                const senha = document.getElementById('senha').value;
                const msgDiv = document.getElementById('mensagemErro');
                
                msgDiv.innerHTML = "";

                if (!email || !senha) {
                    msgDiv.innerHTML = "<p style='color: red;'>Por favor, preencha todos os campos.</p>";
                    return;
                }

                try {
                    let response = await fetch(`http://localhost:3000/funcionarios/busca-email/${encodeURIComponent(email)}`);
                    
                    if (response.ok) {
                        const funcionario = await response.json();
                        if (senha === funcionario.senha) {
                            sessionStorage.setItem("usuarioLogado", JSON.stringify(funcionario));
                            let tipo_funcionario = await fetch(`http://localhost:3000/empresas/${encodeURIComponent(funcionario.empresa)}`);
                            const tipo = await tipo_funcionario.json();
                            if (tipo.tipo === "receptor") {
                                window.location.href = "TelaPrincipalFuncRecpt.html";
                            } else if (tipo.tipo === "produtor") {
                                window.location.href = "TelaPrincipalFuncProd.html";
                            }
                            return;
                        }
                    }

                    response = await fetch(`http://localhost:3000/empresas/busca-email/${encodeURIComponent(email)}`);
                    
                    if (response.ok) {
                        const empresa = await response.json();
                        if (senha === empresa.senha) {
                            sessionStorage.setItem("usuarioLogado", JSON.stringify(empresa));
                            if (empresa.tipo === "receptor"){
                                window.location.href = "tela_empresa_receptora.html";
                            }else if(empresa.tipo === "produtor"){
                                window.location.href = "tela_visualizar_empresa.html";
                            }
                            return;
                        }
                    }

                    response = await fetch(`http://localhost:3000/super_adm/busca-email/${encodeURIComponent(email)}`);
                    
                    if (response.ok) {
                        const super_adm = await response.json();
                        if (senha === super_adm.senha) {
                            window.location.href = "tela_criar_empresa.html";
                            return;
                        }
                    }

                    msgDiv.innerHTML = "<p style='color: red;'>Usuário ou senha incorretos.</p>";

                } catch (error) {
                    console.error("Erro:", error);
                    msgDiv.innerHTML = "<p style='color: red;'>Erro ao conectar com o servidor.</p>";
                }
            }
        </script>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

    </body>
