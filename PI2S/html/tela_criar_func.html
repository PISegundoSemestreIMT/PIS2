    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="../css/Estilo.css">
        <link rel="stylesheet" href="../css/header.css">
        <link rel="stylesheet" href="../css/footer.css">
        <style>
            html, body {
                height: 100%;
                margin: 0;
            }

            body {
                display: flex;
                flex-direction: column;
                min-height: 100vh;
            }

                flex: 1 0 auto;

    </head>
    <body>
        <header class="site-header">
            <nav class="navbar navbar-expand-lg site-navbar">
                <div class="container-fluid">
                    <a class="navbar-brand site-navbar-brand" href="PaginaIncial.html#home" aria-label="3DConecta - Home">
                        <span class="site-logo-wrapper">
                            <img src="../Imagem/logo.png" alt="3DConecta" class="site-logo">
                        </span>
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNavbar" aria-controls="siteNavbar" aria-expanded="false" aria-label="Abrir menu de navegação">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="siteNavbar">
                        <ul class="navbar-nav mx-auto mb-3 mb-lg-0 site-nav-list">
                            <li class="nav-item"><a class="nav-link site-nav-link" href="PaginaIncial.html#home">Home</a></li>
                            <li class="nav-item"><a class="nav-link site-nav-link" href="PaginaIncial.html#sobre-nos">Sobre nós</a></li>
                            <li class="nav-item"><a class="nav-link site-nav-link" href="como_comecar.html">Como começar</a></li>
                        </ul>
                        <a class="btn btn-light site-login-button" href="Entrar.html">Logar</a>
                    </div>
                </div>
            </nav>
        </header>

        <main class="container-fluid py-3">
            <form id="formFuncionario" class="row h-100 g-3">
                <div class="col-sm-12 col-md-8 coluna-esquerda">
                    <div class="formatacaoCaixaArredondada p-3 mb-3 border">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome: *</label>
                            <input type="text" id="nome" name="nome" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email: *</label>
                            <input type="email" id="email" name="email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha: *</label>
                            <input type="password" id="senha" name="senha" class="form-control" required>
                        </div>
                    </div>
                </div>

                <div class="col-sm-12 col-md-4 d-flex flex-column justify-content-between">
                    <aside class="formatacaoCaixaArredondada p-3 border h-100 d-flex flex-column justify-content-between">
                        <div class="d-flex flex-column gap-3 my-auto align-items-center justify-content-center" style="margin-top: 20px;">
                            <button type="button" onclick="window.location.href='PaginaIncial.html'" class="btn" style="background-color: #A70404; color:#fff; height: 50px; width: 150px;">Voltar</button>
                            <button class="btn" style="background-color: #008F11; color:#fff; height: 50px; width: 150px;" type="submit">Cadastrar Funcionário</button>
                        </div>
                    </aside>
                </div>
            </form>
        </main>

        <footer class="site-footer mt-auto">
            <div class="container py-4">
                <div class="row g-4">
                    <section class="col-12 col-md-6 text-center text-md-start">
                        <h2 class="site-footer-heading">Fale conosco</h2>
                        <p class="site-footer-email mb-2"><a href="mailto:3dconecta@gmail.com">3dconecta@gmail.com</a></p>
                        <p class="site-footer-credit mb-0">Desenvolvido para conectar quem precisa a quem pode ajudar.</p>
                    </section>
                    <nav class="col-12 col-md-6 site-footer-navigation text-center text-md-end" aria-label="Navegação do rodapé">
                        <h2 class="site-footer-heading">Navegação</h2>
                        <div class="site-footer-nav d-flex flex-column gap-2">
                            <a href="PaginaIncial.html#home">Início</a>
                            <a href="PaginaIncial.html#sobre-nos">Sobre nós</a>
                            <a href="como_comecar.html">Como começar</a>
                            <a href="https://maua.br/">Instituto Mauá</a>
                            <a href="https://aacd.org.br/">AACD</a>
                        </div>
                    </nav>
                    <div class="col-12">
                        <p class="site-footer-copyright text-center mb-0">© 2026 3DConecta. Todos os direitos reservados.</p>
                    </div>
                </div>
            </div>
        </footer>

        <!-- Scripts do Bootstrap e Axios -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <script>
            const protocolo = 'http://';
            const baseURL = 'localhost:3000';
            let usuario = null; 
            document.addEventListener("DOMContentLoaded", () => {
            
                const dadosSalvos = sessionStorage.getItem("usuarioLogado");

                if (!dadosSalvos) {
                    alert("Acesso negado! Por favor, faça login.");
                    window.location.href = "Entrar.html"; // Nome da sua página de login
                    return;
                }

                usuario = JSON.parse(dadosSalvos);
            });

            // Evento de envio do formulário via Axios
            document.getElementById('formFuncionario').addEventListener('submit', async function(event) {
                event.preventDefault(); // Impede o recarregamento padrão da página

                const nome = document.getElementById('nome').value;
                const email = document.getElementById('email').value;
                const senha = document.getElementById('senha').value;
                const empresa = usuario._id;

                const novoFuncionario = {
                    nome,
                    email,
                    senha,
                    empresa
                };

                try {
                    // Envia a requisição POST para o Back End Node.js rodando na porta 3000[cite: 150]
                    await axios.post(`${protocolo}${baseURL}/funcionarios`, novoFuncionario);

                    alert("Funcionário cadastrado com sucesso!");
                    window.location.href = 'PaginaIncial.html'; // Redireciona após o sucesso
                } catch (error) {
                    console.error("Erro ao cadastrar funcionário:", error);
                    alert("Erro ao cadastrar o funcionário. Verifique se o e-mail já está em uso.");
                }
            });
        </script>
    </body>
</html>
