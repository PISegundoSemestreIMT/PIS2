    <main class="container my-4">
        <div class="container-abas col-12 mb-3">
            <div class="aba ativa" onclick="mudarAba(event, 'pedidos')">Pedidos</div>
            <div class="aba" onclick="mudarAba(event, 'funcionarios')">Funcionários</div>
            <div class="aba" onclick="mudarAba(event, 'impressoras')">Impressoras</div>
        </div>

        <div class="container-conteudo col-12">
            <div id="pedidos" class="conteudo-aba ativo formatacaoCaixaArredondada p-3"
                style="max-height: 610px; overflow-y: auto;">
            </div>

            <div id="funcionarios" class="conteudo-aba formatacaoCaixaArredondada p-3"
                style="max-height: 610px; overflow-y: auto;">
            </div>

            <div id="impressoras" class="conteudo-aba formatacaoCaixaArredondada p-3"
                style="max-height: 610px; overflow-y: auto;">
            </div>
            <div class="col-12" style="display: flex; align-items: center; justify-content: space-between;">
                <button class="btn btn-primary mt-3" type="button" onclick="criarFuncionario(event)"
                    style="background-color: #006ad4; border-color: #006ad4; height: 50px; width: 150px;">Criar
                    Funcionário</button>
                <button class="btn btn-primary mt-3" type="button" onclick="criarImpressora(event)"
                    style="background-color: #006ad4; border-color: #006ad4; height: 50px; width: 150px;">Criar

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
    const protocolo = 'http://';
    const baseURL = 'localhost:3000';
    let usuario = null;

    function esc(t) {
        return String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function mudarAba(evento, idAba) {
        document.querySelectorAll('.aba').forEach(aba => aba.classList.remove('ativa'));
        document.querySelectorAll('.conteudo-aba').forEach(c => c.classList.remove('ativo'));
        evento.currentTarget.classList.add('ativa');
        document.getElementById(idAba).classList.add('ativo');
    }

    document.addEventListener("DOMContentLoaded", () => {
        const dadosSalvos = sessionStorage.getItem("usuarioLogado");

        if (!dadosSalvos) {
            alert("Acesso negado! Por favor, faça login.");
            window.location.href = "Entrar.html";
            return;
        }

        usuario = JSON.parse(dadosSalvos);
        carregarFuncionarios();
        carregarImpressoras();
    });

    async function carregarFuncionarios() {
        const div = document.getElementById('funcionarios');
        try {
            const resposta = await axios.get(`${protocolo}${baseURL}/funcionarios`);
            const lista = resposta.data.filter(f => f.empresa === usuario._id);

            if (lista.length === 0) {
                div.innerHTML = '<p class="text-center text-muted">Nenhum funcionário cadastrado.</p>';
                return;
            }

            div.innerHTML = lista.map(f => `
                <div class="formatacaoCaixaArredondada p-3 mb-3 border bg-white">
                    <p class="mb-1"><strong>Nome:</strong> ${esc(f.nome)}</p>
                    <p class="mb-0"><strong>Email:</strong> ${esc(f.email)}</p>
                </div>
            `).join('');
        } catch (erro) {
            console.error("Erro ao carregar funcionários:", erro);
            div.innerHTML = '<p class="text-center text-danger">Erro ao carregar os funcionários.</p>';
        }
    }

    async function carregarImpressoras() {
        const div = document.getElementById('impressoras');
        try {
            const resposta = await axios.get(`${protocolo}${baseURL}/empresas/${usuario._id}/impressoras`);
            const lista = resposta.data;

            if (lista.length === 0) {
                div.innerHTML = '<p class="text-center text-muted">Nenhuma impressora cadastrada.</p>';
                return;
            }

            div.innerHTML = lista.map(i => `
                <div class="formatacaoCaixaArredondada p-3 mb-3 border bg-white">
                    <p class="mb-1"><strong>Nome:</strong> ${esc(i.nome_impressora)}</p>
                    <p class="mb-1"><strong>Marca:</strong> ${esc(i.marca)}</p>
                    <p class="mb-1"><strong>Volume útil (mm):</strong> ${esc(i.volume_util?.x)} x ${esc(i.volume_util?.y)} x ${esc(i.volume_util?.z)}</p>
                    <p class="mb-0"><strong>Filamentos:</strong> ${esc((i.filamentos || []).join(', '))}</p>
                </div>
            `).join('');
        } catch (erro) {
            console.error("Erro ao carregar impressoras:", erro);
            div.innerHTML = '<p class="text-center text-danger">Erro ao carregar as impressoras.</p>';
        }
    }

    function criarFuncionario(event) {
        event.preventDefault();
        if (!sessionStorage.getItem("usuarioLogado")) {
            alert("Erro: Você precisa estar logado.");
            window.location.href = "Entrar.html";
            return;
        }
        window.location.href = "tela_criar_func.html";
    }

    function criarImpressora(event) {
        event.preventDefault();
        if (!sessionStorage.getItem("usuarioLogado")) {
            alert("Erro: Você precisa estar logado.");
            window.location.href = "Entrar.html";
            return;
        }
        window.location.href = "tela_criar_impressora.html";
    }

    function fazerLogout() {
        sessionStorage.removeItem("usuarioLogado");
        window.location.href = "Entrar.html";
    }
</script>
</body>

</html>
