<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">
        <link rel="stylesheet" href="Estilo.css">
    </head>
    <body>
        <header class="headerDaPagina col-12">
            <a href="PaginaIncial.html"><img src="Imagem/logo.png" alt="Logo" height="150" weight="150"></a>
        </header>
        <main class="container-fluid">
            <form class="row" style="flex: 1; gap: 20px;">
                <div class="col-sm-12 col-md-8" style="flex-direction: column">
                    <div class="formatacaoCaixaArredondada" style="margin-top: 20px; margin-left: 20px; margin-right: 20px; padding: 20px;">
                        <label for="nome">Nome:*
                            <input type="text" id="nome">
                        </label>
                        <label for="filamento">Filamento: *
                            <select id="filamento">
                                <option value="PLA">PLA</option>
                                <option value="ABS">ABS</option>
                                <option value="PETG">PETG</option>
                                <option value="TPU">TPU</option>
                                <option value="Nylon">Nylon</option>
                                <option value="ASA">ASA</option>
                                <option value="Outro">Outro (coloque na descrição)</option>
                            </select>
                        </label>
                        <label for="tempo" class="form-label">Tempo estimado de fabricação (HH:MM): *</label>
                        <input type="text" id="tempo" class="form-control" pattern="[0-9]+:[0-5][0-9]" placeholder="Ex: 36:45" style="border-color: #000; box-shadow: none; outline: 0;" title="Informe o tempo acumulado no formato HH:MM (Ex: 48:30)" required>
                        <p>Descrição da peça:</p>
                        <textarea style="width: 100%; height: 100px; resize: none; border-radius: 20px; border-color: #000;"></textarea>
                    </div>
                    <div class="formatacaoCaixaArredondada" style="margin: 20px; padding: 20px;">
                        <label for="arquivo">Arquivo da peça (formato .STL e .3MF): *
                            <div class ="formatacaoCaixaArredondada" style="width: 100%; height: 100px; display: flex; align-items: center; justify-content: center; border: 1px solid #000; border-radius: 20px;">
                                <p>Arraste e solte o arquivo aqui</p>
                                <input type="file" id="arquivo" accept=".stl,.3mf">
                            </div>
                        </label>
                    </div>
                </div>
                <aside class="formatacaoCaixaArredondada col-sm-12 col-md-4" style="padding: 20px;">
                    <div class="formatacaoCaixaArredondada" style="margin-top: 20px; padding: 20px;">
                        <h2>Alerta em Tempo Real:</h2>
                        <p>Você será notificado instantaneamente via spam assim que um fabricante aceitar apeça, com <strong>identificação corporativa do fornecedor</strong></p>
                    </div>
                    <div style="display: flex; flex-direction: column; width: fit-content; gap: 15px; margin: 20px auto 0 auto; align-items: center; justify-content: center;">
                        <button type="button" onclick="window.location.href='TelaPrincipalFuncRecpt.html'" style="background-color: #A70404; color:#fff; border: solid #A70404; height: 50px; width: 150px;">Voltar</button>
                        <button style="background-color: #008F11; color:#fff; border: solid #008F11; height: 50px; width: 150px;" type="submit">Enviar Solicitação</button>
                    </div>
                </aside>
            </form>
        </main>
        <footer class="footerDaPagina col-12">
            <h3>Fundadores:</h3>
            <nav style="display: flex; gap: 20px;">
                <a style="color: #fff; text-decoration: none;" href="https://maua.br/">Instituto Mauá de Tecnologia</a>
                <a style="color: #fff; text-decoration: none;" href="https://aacd.org.br/">AACD</a>
            </nav>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8" crossorigin="anonymous"></script>
    </body>
</html>
