<!DOCTYPE html>
<html lang="pt-BR" style="height: 100%;">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">
        <link rel="stylesheet" href="Estilo.css">
        <style>
            html, body {
                height: 100%;
                margin: 0;
            }

            body {
                display: flex;
                flex-direction: column;
                min-height: 100vh;
            }

            main {
                flex: 1 0 auto;
                display: flex;
                flex-direction: column;
            }

            form {
                flex: 1;
            }

            .coluna-esquerda {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }

        </style>
    </head>
    <body>
        <header class="headerDaPagina col-12">
            <a href="PaginaIncial.html"><img src="Imagem/logo.png" alt="Logo" height="100" width="250"></a>
        </header>

        <main class="container-fluid py-3">
            <form class="row h-100 g-3">
                <div class="col-sm-12 col-md-8 coluna-esquerda">
                    <div class="formatacaoCaixaArredondada p-3 mb-3 border">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome: *</label>
                            <input type="text" id="nome" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label for="filamento" class="form-label">Filamento: *</label>
                            <select id="filamento" class="form-select">
                                <option value="PLA">PLA</option>
                                <option value="ABS">ABS</option>
                                <option value="PETG">PETG</option>
                                <option value="TPU">TPU</option>
                                <option value="Nylon">Nylon</option>
                                <option value="ASA">ASA</option>
                                <option value="Outro">Outro (coloque na descrição)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="tempo" class="form-label">Tempo estimado de fabricação (HH:MM): *</label>
                            <input type="text" id="tempo" class="form-control" pattern="[0-9]+:[0-5][0-9]" placeholder="Ex: 36:45" style="border-color: #000;" title="Informe o tempo acumulado no formato HH:MM (Ex: 48:30)" required>
                        </div>

                        <div class="mb-3">
                            <label for="descricao" class="form-label">Descrição da peça:</label>
                            <textarea id="descricao" class="form-control" style="height: 100px; resize: none; border-radius: 15px; border-color: #000;"></textarea>
                        </div>
                    </div>

                    <div class="formatacaoCaixaArredondada p-3 border d-flex flex-column align-items-center justify-content-center">
                        <label for="arquivo" class="w-100 text-center">Arquivo da peça (formato .STL e .3MF): *
                            <div class="formatacaoCaixaArredondada mt-2 d-flex flex-column align-items-center justify-content-center border" style="height: 120px; border-radius: 15px;">
                                <p class="m-0 mb-2">Arraste e solte o arquivo aqui</p>
                                <input type="file" id="arquivo" accept=".stl,.3mf">
                            </div>
                        </label>
                    </div>
                </div>

                <div class="col-sm-12 col-md-4 d-flex flex-column justify-content-between">
                    <aside class="formatacaoCaixaArredondada p-3 border h-100 d-flex flex-column justify-content-between">
                        <div class="formatacaoCaixaArredondada p-3 border">
                            <h2>Alerta em Tempo Real:</h2>
                            <p>Você será notificado instantaneamente via spam assim que um fabricante aceitar a peça, com <strong>identificação corporativa do fornecedor</strong></p>
                        </div>

                        <div class="d-flex flex-column gap-3 my-auto align-items-center justify-content-center">
                            <button type="button" onclick="window.location.href='TelaPrincipalFuncRecpt.html'" class="btn" style="background-color: #A70404; color:#fff; height: 50px; width: 150px;">Voltar</button>
                            <button class="btn" style="background-color: #008F11; color:#fff; height: 50px; width: 150px;" type="submit">Enviar Solicitação</button>
                        </div>
                    </aside>
                </div>
            </form>
        </main>

        <footer class="footerDaPagina col-12 py-3 mt-auto">
            <div class="container-fluid d-flex flex-column align-items-center">
                <h3>Fundadores:</h3>
                <nav class="d-flex gap-4">
                    <a style="color: #fff; text-decoration: none;" href="https://maua.br/" target="_blank">Instituto Mauá de Tecnologia</a>
                    <a style="color: #fff; text-decoration: none;" href="https://aacd.org.br/" target="_blank">AACD</a>
                </nav>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8" crossorigin="anonymous"></script>
    </body>
</html>
